<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Cleo</title>

</head>

<body>
  <div class="container">
    <!-- Speech Bubble -->
    <div id="bubble" class="speech-bubble"></div>

    <!-- Robot Avatar -->
    <div id="avatar" class="avatar-container">
      <div class="avatar-robot">
        <div class="robot-head">
          <div class="robot-face">
            <div class="robot-eyes">
              <span class="eye left"></span>
              <span class="eye right"></span>
            </div>
            <div class="robot-mouth">
              <div class="mouth-wave"></div>
              <div class="mouth-wave"></div>
              <div class="mouth-wave"></div>
            </div>
          </div>
        </div>
        <div class="robot-body">
          <div class="body-core"></div>
          <div class="body-ring"></div>
        </div>
        <div class="robot-shadow"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/renderer.ts"></script>
</body>

</html>
